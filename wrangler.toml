name = "astra-store"
main = "server/worker.ts"
compatibility_date = "2025-09-27"
account_id = "9b522ee211d2d81291ed46b7c44f6025"
workers_dev = true

[vars]
SITE_URL = "https://elkku01.github.io/astra-website"
COLLECTION_LIMIT = "100"

# Secrets (uploaded by .github/workflows/store-api.yml, or `wrangler secret put`):
#   ADMIN_PASSWORD, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET

# Old single-blob store. Only read once, to migrate into STORE_DB.
[[kv_namespaces]]
binding = "STORE"
id = "c21b3b2f5a8249cca6d67d9f381cef8c"

[[durable_objects.bindings]]
name = "STORE_DB"
class_name = "StoreDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreDB"]
